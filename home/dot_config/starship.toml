"$schema" = 'https://starship.rs/config-schema.json'

# ── Algemeen ──────────────────────────────────────────────────────────────────
add_newline = true
command_timeout = 1000   # ms; az/terraform kunnen traag zijn op koude cache
scan_timeout = 30        # ms; houdt grote Terraform-repos snel

# Basis: Starship's ingebouwde "catppuccin-powerline" preset (`starship preset
# catppuccin-powerline`), met de eigen segmenten (Claude Code, Azure, Terraform)
# teruggezet en elk segment voorzien van een eigen icoon.
format = """
[](lavender)\
$time\
[ ](fg:lavender)\
${env_var.CLAUDECODE}\
[](peach)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_state\
$git_status\
[](fg:yellow bg:green)\
$dotnet\
$python\
[ ](fg:green)\
${custom.claude}\
$azure\
$terraform\
$cmd_duration\
$line_break\
$character"""

# Flavour wisselen: verander onderstaande regel in bv. 'catppuccin_latte' of
# 'catppuccin_macchiato'. Alle vier de paletten staan hieronder klaar.
palette = 'catppuccin_mocha'

# ── Tijd ──────────────────────────────────────────────────────────────────────
# Icoon:  (klok)
[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

# ── Locatie ───────────────────────────────────────────────────────────────────
# Icoon: 󰆋 (map)
[directory]
style = "bg:peach fg:crust"
format = "[ 󰉋 $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bg:peach fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ── Git ───────────────────────────────────────────────────────────────────────
# Iconen:  (branch),  (merge/rebase bezig), plus de ingebouwde
# statusglyphs van git_status zelf (⇡ ahead, ⇣ behind, ! modified, + staged, ...)
[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_state]
style = "bg:yellow"
format = '[[  $state( $progress_current/$progress_total) ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

# ── Talen ─────────────────────────────────────────────────────────────────────
# Iconen:  (.NET),  (Python). Overige taalmodules (Node, Rust, Go, ...) staan
# niet in $format en worden dus nooit getoond — bewuste keuze om ruis te beperken.
[dotnet]
symbol = " "
style = "bg:green"
heuristic = true
format = '[[ $symbol($tfm ) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol($version )(\(#$virtualenv\) ) ](fg:crust bg:green)]($style)'

# ── Claude ────────────────────────────────────────────────────────────────────
# 1) Sessie-indicator: deze shell is gestart binnen Claude Code. Claude Code
# exporteert CLAUDECODE=1 naar subprocessen, dus dit is een betrouwbaar signaal
# dat je niet in een "gewone" shell zit. Icoon: 
[env_var.CLAUDECODE]
variable = "CLAUDECODE"
symbol = ""
style = "bold #d97757"
format = "[${symbol} claude-code]($style) "

# 2) Repo-indicator: deze repo heeft een CLAUDE.md. Alleen op dit bestand
# detecteren (niet op .claude/): anders vuurt dit ook in ~ af, want daar staat
# de globale Claude Code-config (~/.claude), die geen repo-indicator hoort te zijn.
# Icoon: 
[custom.claude]
description = "Repo bevat een CLAUDE.md"
detect_files = ["CLAUDE.md"]
command = "echo claude"
format = "[$symbol $output]($style) "
symbol = ""
style = "bold #d97757"

# ── Azure ─────────────────────────────────────────────────────────────────────
# Laat de actieve subscription zien. Gebruik aliases om lange namen in te korten;
# de sleutel moet exact de subscriptionnaam of -id zijn (az account list -o table).
# Icoon: 󰠅
[azure]
disabled = false
symbol = "󰠅 "
style = "bold blue"
format = "on [$symbol($subscription)( as $username)]($style) "

[azure.subscription_aliases]
"MyCompany-Platform-Production" = "plat-prd"
"MyCompany-Platform-Acceptance" = "plat-acc"
"MyCompany-Connectivity"        = "conn"
"MyCompany-Identity"            = "idam"
"MyCompany-Management"          = "mgmt"

# ── Terraform ─────────────────────────────────────────────────────────────────
# Alleen de workspace, geen versie: `terraform version` kost te veel tijd per prompt.
# Icoon: 󱁢
[terraform]
symbol = "󱁢 "
style = "bold mauve"
format = "via [$symbol$workspace]($style) "
detect_extensions = ["tf", "tfvars", "tfplan", "tfstate", "hcl"]
detect_folders = [".terraform"]

# ── Duur vorige commando ──────────────────────────────────────────────────────
# Icoon:  (zandloper). Toont alleen als het vorige commando >2s duurde.
[cmd_duration]
min_time = 2000
style = "bold lavender"
format = "[ took $duration]($style) "

# ── Prompt-teken ──────────────────────────────────────────────────────────────
# Icoon: ❯ (normale modus), ❮ (vim-modi)
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[line_break]
disabled = false


"$schema" = 'https://starship.rs/config-schema.json'

# ── General ───────────────────────────────────────────────────────────────────
add_newline = true
command_timeout = 1000   # ms; az/terraform can be slow on a cold cache
scan_timeout = 30        # ms; keeps large Terraform repos fast

# Base: Starship's built-in "catppuccin-powerline" preset (`starship preset
# catppuccin-powerline`), with the project-specific segments (Claude Code, Azure,
# Terraform) added back and every segment given its own icon.
format = """
[](lavender)\
$time\
[ ](fg:lavender)\
${env_var.CLAUDECODE}\
[](peach)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_state\
$git_status\
[](fg:yellow bg:green)\
$dotnet\
$python\
[ ](fg:green)\
${custom.claude}\
$azure\
$terraform\
$cmd_duration\
$line_break\
$character"""

# To switch flavour, change the line below to e.g. 'catppuccin_latte' or
# 'catppuccin_macchiato'. All four palettes are defined further down.
palette = 'catppuccin_mocha'

# ── Time ──────────────────────────────────────────────────────────────────────
# Icon:  (clock)
[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

# ── Location ──────────────────────────────────────────────────────────────────
# Icon: 󰆋 (folder)
[directory]
style = "bg:peach fg:crust"
format = "[ 󰉋 $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bg:peach fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ── Git ───────────────────────────────────────────────────────────────────────
# Icons:  (branch),  (merge/rebase in progress), plus git_status's
# own built-in status glyphs (⇡ ahead, ⇣ behind, ! modified, + staged, ...)
[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_state]
style = "bg:yellow"
format = '[[  $state( $progress_current/$progress_total) ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

# ── Languages ─────────────────────────────────────────────────────────────────
# Icons:  (.NET),  (Python). Other language modules (Node, Rust, Go, ...) are
# not in $format and therefore never shown, a deliberate choice to limit noise.
[dotnet]
symbol = " "
style = "bg:green"
heuristic = true
format = '[[ $symbol($tfm ) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol($version )(\(#$virtualenv\) ) ](fg:crust bg:green)]($style)'

# ── Claude ────────────────────────────────────────────────────────────────────
# 1) Session indicator: this shell was started inside Claude Code. Claude Code
# exports CLAUDECODE=1 to subprocesses, so this is a reliable signal that you
# are not in an ordinary shell. Icon: 
[env_var.CLAUDECODE]
variable = "CLAUDECODE"
symbol = ""
style = "bold #d97757"
format = "[${symbol} claude-code]($style) "

# 2) Repo indicator: this repo has a CLAUDE.md. Detect only that file (not
# .claude/): otherwise this also fires in ~, where the global Claude Code config
# (~/.claude) lives, which should not count as a repo indicator.
# Deliberately without `command`: the text is literal in `format`, so Starship
# never spawns a subprocess per prompt (on Windows, via STARSHIP_SHELL=pwsh,
# that was a full pwsh start of ~500 ms).
# Icon: 
[custom.claude]
description = "Repo contains a CLAUDE.md"
detect_files = ["CLAUDE.md"]
format = "[$symbol claude]($style) "
symbol = ""
style = "bold #d97757"

# ── Azure ─────────────────────────────────────────────────────────────────────
# Shows the active subscription. Use aliases to shorten long names; the key must
# match the subscription name or id exactly (az account list -o table).
# Icon: 󰠅
[azure]
disabled = false
symbol = "󰠅 "
style = "bold blue"
format = "on [$symbol($subscription)( as $username)]($style) "

[azure.subscription_aliases]
"MyCompany-Platform-Production" = "plat-prd"
"MyCompany-Platform-Acceptance" = "plat-acc"
"MyCompany-Connectivity"        = "conn"
"MyCompany-Identity"            = "idam"
"MyCompany-Management"          = "mgmt"

# ── Terraform ─────────────────────────────────────────────────────────────────
# Workspace only, no version: `terraform version` costs too much time per prompt.
# Icon: 󱁢
[terraform]
symbol = "󱁢 "
style = "bold mauve"
format = "via [$symbol$workspace]($style) "
detect_extensions = ["tf", "tfvars", "tfplan", "tfstate", "hcl"]
detect_folders = [".terraform"]

# ── Previous command duration ─────────────────────────────────────────────────
# Icon:  (hourglass). Shown only when the previous command took >2s.
[cmd_duration]
min_time = 2000
style = "bold lavender"
format = "[ took $duration]($style) "

# ── Prompt character ──────────────────────────────────────────────────────────
# Icon: ❯ (normal mode), ❮ (vim modes)
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[line_break]
disabled = false

